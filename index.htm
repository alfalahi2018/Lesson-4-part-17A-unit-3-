<script>

const RW=[['Girl','I’m going to visit the mountains for the holidays. What are your plans, Rawan?'],['Rawan','I’m going to stay at the beach in France with my cousins.'],['Girl','Really? Won’t it be cold at this time of year?'],['Rawan','No, it will be warm, and there won’t be many people around.'],['Girl','Are you going to travel there by car?'],['Rawan','No, it’s too far. We’re going to fly.'],['Girl','Well, have fun. And send me a postcard!'],['Rawan','A postcard? No way! I’ll send you a selfie!'],['Girl','OK, and I’ll send you an email from the mountains!']];

const GW=N(['going to','will']);
const A=[
{n:'1 · Going to or will?',min:3,type:'mc',q:[
{pr:'You bought your tickets yesterday. Which one do you use?',o:GW,a:0},
{pr:'You are cold. You decide now to close the window. Which one do you use?',o:GW,a:1},
{pr:'You planned your trip last week. Which one do you use?',o:GW,a:0},
{pr:'Your friend has a heavy bag. You offer to help right now. Which one do you use?',o:GW,a:1}]},
{n:'2 · Rawan’s holidays',min:4,type:'mc',lines:RW,q:[
{pr:'Where is Rawan going to go for the holidays?',o:N(['The mountains','The beach in France','A city in Spain']),a:1},
{pr:'What will the weather be like in France?',o:N(['Warm','Cold','Rainy']),a:0},
{pr:'How is her family going to travel?',o:N(['By car','By boat','By plane']),a:2},
{pr:'What will Rawan send her friend?',o:N(['A postcard','A selfie','An email']),a:1}]},
{n:'3 · Rashid and Mansoor',min:3,type:'mc',q:[
{pr:'Rashid: “What ___ do next weekend?”',o:N(['are you going to','will you']),a:0,ex:'Rashid asks about plans.'},
{pr:'Mansoor: “If it’s nice weather, ___ go camping.”',o:N(['I’ll','I’m going to']),a:0,ex:'After if + present, we use will.'},
{pr:'Mansoor: “If you come, will you bring your camping stove?”<br>Rashid: “Of course! ___ take a tent.”',o:N(['I’m going to','I’ll']),a:1,ex:'He decides at the time of speaking.'},
{pr:'Mansoor: “Can you bring a first-aid kit?”<br>Rashid: “OK, ___.”',o:N(['I’m going to','I will']),a:1,ex:'He decides at the time of speaking.'},
{pr:'Rashid: “Where ___ go camping?”',o:N(['will we','are we going to']),a:1,ex:'Rashid asks about the plan.'},

{n:'4 · Complete the sentences',min:4,type:'mc',q:[
{pr:'I’m hungry. I think I ___ a sandwich.',o:N(['will make','am going to make','won’t make']),a:0},
{pr:'We ___ to the cinema later. We bought our tickets online.',o:N(['will go','are going to go','aren’t going to go']),a:1},
{pr:'Omaima ___ basketball today. She has her swimming lesson at 4 o’clock.',o:N(['will play','is going to play','isn’t going to play']),a:2},
{pr:'Don’t worry about your journey to Muscat next week. You ___ any problems.',o:N(['will have','won’t have','aren’t going to have']),a:1},
{pr:'If you wait a minute, I ___ you with those big suitcases.',o:N(['help','am going to help','will help']),a:2},
{pr:'My friends ___ videos today. They want to go cycling because it’s a nice day.',o:N(['aren’t going to watch','will watch','are going to watch']),a:0},
{pr:'It’s late. I think I ___ to bed now.',o:N(['’m going to go','’ll go','won’t go']),a:1},
{pr:'Bassam is playing football on Saturday and we ___ him. Do you want to come?',o:N(['will watch','aren’t going to watch','are going to watch']),a:2}]},
{n:'5 · Grandma’s things',min:5,type:'mc',lines:GM,q:[
{pr:'Where did Grandma get the suitcase?',o:N(['In a shop that sold handbags in Egypt','In a market in Cairo','On a street in Mexico']),a:0},
{pr:'Where did Grandma get the musical instrument?',o:N(['In a market in Cairo','From a man in the street in Mexico','In a shop on a boat']),a:1},
{pr:'Where did Grandma get the flip-flops?',o:N(['A bookshop in London','A shop on a boat','A market in Cairo']),a:2},
{pr:'Where did Grandma get the guidebook?',o:N(['A little shop on a boat','A bookshop in London','A beach in Oman']),a:0},
{pr:'What’s the suitcase made of?',o:N(['Plastic','Leather','Cotton']),a:1},
{pr:'Which thing is from Mexico?',o:N(['The guidebook','The suitcase','The musical instrument']),a:2},
{pr:'What does the musical instrument look like?',o:N(['A turtle','A bowl','A bag']),a:0},
{pr:'Who bought the flip-flops?',o:N(['The girl','The girl’s grandfather','Grandma']),a:1},
{pr:'When will the girl wear the flip-flops?',o:N(['At school','In winter','On holiday']),a:2},
{pr:'What’s Grandma going to buy?',o:N(['A new suitcase','A new guidebook','A new instrument']),a:1}]},
{n:'6 · Bus trip',min:3,type:'bus'},
{n:'7 · Final task',min:3,type:'cloze'}];
const CL=6;
const C={t:'Grandma got her small leather suitcase in {0} (1). The flip-flops are from a {1} (2) in Cairo. The girl says, “I {2} take them on holiday.” (3) Grandma says, “I {3} buy a new guidebook.” (4) She also says, “I {4} play the musical instrument for you.” (5)',o:[['Egypt','Mexico','Spain'],['boat','market','street'],['won’t','’ll','isn’t going to'],['’m going to','will not','won’t'],['’m going to','won’t','’ll']],a:[0,1,1,0,2]};

let ac;function tone(f,d,ty){try{ac=ac||new(window.AudioContext||window.webkitAudioContext)();f.forEach((hz,i)=>{const o=ac.createOscillator(),g=ac.createGain();o.type=ty||'sine';o.frequency.value=hz;const t=ac.currentTime+i*d;g.gain.setValueAtTime(.18,t);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g);g.connect(ac.destination);o.start(t);o.stop(t+d)})}catch(e){}}
function say(t,p){try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='en-GB';u.rate=.85;u.pitch=p||1;speechSynthesis.speak(u)}catch(e){}}

function mc(a,s){
 const q=a.q[s.i],n=a.q.length,lk=s.pk!==null,ok=lk&&s.pk===q.a;

 const au=a.lines?'<div class="row" style="justify-content:flex-start"><button class="go alt" style="padding:8px 24px;font-size:18px" onclick="play()">▶ Listen</button><button class="go" style="padding:8px 24px;font-size:18px" onclick="scr()">'+(s.sh?'Hide':'Show')+' the script</button></div>'+(s.sh?'<div class="scr">'+a.lines.map(l=>'<b>'+l[0]+':</b> '+l[1]).join('<br>')+'</div>':''):'';
 return '<div class="card"><div class="meta"><span>'+a.n+' · '+a.min+' min</span><span>Question '+(s.i+1)+' / '+n+' · Stars: '+s.sc+'</span></div>'+au+'<div class="q">'+pr+'</div><div class="grid">'+q.o.map((o,i)=>'<button class="o'+(lk&&i===q.a?' ok':lk&&i===s.pk?' bad':'')+'" '+(lk?'disabled':'')+' onclick="pick('+i+')">'+o.t+'</button>').join('')+'</div><div class="fb">'+(lk?(ok?'Great job! ':'Not quite. ')+'The answer is: '+q.o[q.a].t+'. '+(q.ex||''):'Choose the correct answer.')+'</div><button class="go" onclick="nxt()" '+(lk?'':'disabled')+'>'+(s.i+1===n?'Finish':'Next →')+'</button></div>'}
function view(){
 const a=A[S.step],s=S.st[S.step];
 if(a.type==='mc')return mc(a,s);
 if(a.type==='bus'){const k=Object.keys(s.sel);return '<div class="card"><h2>'+a.n+' · '+a.min+' min — Imagine you’re going on a long bus trip.</h2><div class="learn">Choose <b>six</b> things to take in your small bag. Chosen: '+k.length+' / 6</div><div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(130px,1fr))">'+SY.map(w=>'<button class="sc'+(s.sel[w]?' on':'')+'" onclick="bp(\''+w+'\')">'+ic(w,52)+w+'</button>').join('')+'</div>'+(k.length===6?'<div class="scr">'+k.map(w=>'A: I’m going to take '+ph(w)+'.<br>B: Good idea! <b>I’ll</b> take '+ph(w)+', too.').join('<br>')+'</div><div class="row"><button class="go alt" onclick="bsay()">▶ Hear the dialogue</button><button class="go" onclick="go(6)">Final task →</button></div>':'')+'</div>'}
 const g=i=>'<b>'+(s.ans[i]===undefined?'______':C.o[i][s.ans[i]])+'</b>',n=C.a.filter((x,i)=>s.ans[i]===x).length;
 return '<div class="card"><div class="meta"><span>Finishing the lesson · Grammar</span><b>(5 marks)</b></div><div style="font-style:italic;font-size:18px">For each item, shade in the bubble next to the correct option.</div><div class="box">'+C.t.replace(/\{(\d)\}/g,(m,i)=>g(+i))+'</div>'+C.o.map((os,gi)=>'<div class="cz"><b>'+(gi+1)+')</b>'+os.map((w,i)=>{const sel=s.ans[gi]===i,cls=s.chk&&i===C.a[gi]?' ok':s.chk&&sel?' bad':'';return '<button class="o'+(sel?' sel':'')+cls+'" onclick="cl('+gi+','+i+')"><span class="dot"></span>'+w+'</button>'}).join('')+'</div>').join('')+'<div class="row"><b style="font-size:26px;color:#E8553D;margin-right:auto">'+(s.chk?'Score: '+n+' / 5':'')+'</b><span>'+(s.chk?(n===5?'Excellent!':'Review: '+C.a.map((x,i)=>s.ans[i]!==x?C.o[i][x]:null).filter(Boolean).join(', ')):'Answer all 5 items, then press Check.')+'</span><button class="go alt" onclick="chk()">Check</button><button class="go" onclick="retry()">Try again</button></div><div class="credit">Created by T.Badria Alfalahi</div></div>'}
